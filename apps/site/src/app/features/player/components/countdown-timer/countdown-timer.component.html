<span (click)="togglePlay()" title="Остановить/Запустить" class="button">
  @if (stopped()) {
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="icon-greyscale">
      <path d="M8 5v14l11-7z"/>
    </svg>
  } @else {
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="icon-greyscale">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
  }
</span>
<countdown [config]="countdownConfig" (event)="trigger($event)"></countdown>
<span (click)="resetTimer()" title="Перезапустить" class="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="icon-greyscale">
      <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
    </svg>
</span>
